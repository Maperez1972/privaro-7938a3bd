    <!-- Google Consent Mode v2 (advanced) — must run BEFORE gtag.js loads -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      window.gtag = gtag;

      var PRIVARO_CONSENT_KEY = 'privaro-consent-v1';
      var privaroStoredConsent = null;
      try {
        var rawConsent = localStorage.getItem(PRIVARO_CONSENT_KEY);
        if (rawConsent) privaroStoredConsent = JSON.parse(rawConsent);
      } catch (e) {}
      function privaroConsentValue(key) {
        return privaroStoredConsent && privaroStoredConsent[key] === 'granted' ? 'granted' : 'denied';
      }
      gtag('consent', 'default', {
        ad_storage: privaroConsentValue('ad_storage'),
        ad_user_data: privaroConsentValue('ad_user_data'),
        ad_personalization: privaroConsentValue('ad_personalization'),
        analytics_storage: privaroConsentValue('analytics_storage'),
        functionality_storage: 'granted',
        security_storage: 'granted',
        personalization_storage: 'denied',
        wait_for_update: 500
      });
      gtag('set', 'url_passthrough', true);
      gtag('set', 'ads_data_redaction', true);
    </script>

    <!-- Google tag (gtag.js) -->
    <!-- gtag.js is injected after load (see below) to keep the main thread free -->
    <script>


      gtag('js', new Date());

      // Directory attribution: map ?via=<slug> (or a registered alternative
      // parameter) to a GA4 campaign source.
      var PRIVARO_VIA_SOURCES = {
        topaitools: 'TopAI.tools',
        taaft: "There's An AI For That",
        alternativeto: 'AlternativeTo',
        toolify: 'Toolify',
        futuretools: 'FutureTools',
        producthunt: 'Product Hunt',
        g2: 'G2',
        bestai: 'Best-AI.org',
        launchnest: 'LaunchNest',
        'uneed.best': 'Uneed',
        dangai: 'Dang.ai'
      };
      // Directories with their own referral format instead of ?via=<slug>.
      // Add a new entry here (and in ALT_ATTRIBUTION_PARAMS in
      // src/lib/referral-sources.ts) to support another directory.
      var PRIVARO_ALT_PARAMS = [
        { param: 'ref', contentParam: 'ref_type' } // Uneed: ?ref=uneed.best&ref_type=adv
      ];
      var privaroConfig = { send_page_view: true };
      try {
        var privaroQs = new URLSearchParams(window.location.search);
        var viaSlug = null;
        var viaContent = null;
        var viaParam = privaroQs.get('via');
        if (viaParam) {
          viaSlug = viaParam.toLowerCase().trim();
          viaContent = viaSlug;
        } else {
          for (var altIdx = 0; altIdx < PRIVARO_ALT_PARAMS.length; altIdx++) {
            var altParam = PRIVARO_ALT_PARAMS[altIdx];
            var altValue = privaroQs.get(altParam.param);
            if (altValue) {
              viaSlug = altValue.toLowerCase().trim();
              viaContent = (altParam.contentParam && privaroQs.get(altParam.contentParam)) || viaSlug;
              break;
            }
          }
        }
        if (viaSlug) {
          sessionStorage.setItem('privaro_via', viaSlug);
          sessionStorage.setItem('privaro_via_content', viaContent);
        } else {
          viaSlug = sessionStorage.getItem('privaro_via');
          viaContent = sessionStorage.getItem('privaro_via_content') || viaSlug;
        }
        if (viaSlug) {
          var viaName = PRIVARO_VIA_SOURCES[viaSlug] || viaSlug;
          privaroConfig.campaign_source = viaName;
          privaroConfig.campaign_medium = 'referral';
          privaroConfig.campaign_name = 'directory_listing';
          privaroConfig.campaign_content = viaContent;
          // Custom dimensions: attach to the initial page_view and to every
          // subsequent event in the session via gtag('set').
          privaroConfig.via_source = viaSlug;
          privaroConfig.directory_platform = viaName;
          window.privaroVia = { slug: viaSlug, name: viaName, content: viaContent };
        }
      } catch (e) {}
      gtag('config', 'G-5ELLFF522G', privaroConfig);
      if (window.privaroVia) {
        gtag('set', {
          via_source: window.privaroVia.slug,
          directory_platform: window.privaroVia.name
        });
        gtag('event', 'directory_referral', {
          via_source: window.privaroVia.slug,
          directory_platform: window.privaroVia.name
        });
      }

    </script>
